name: Auto-Approve and Merge Jules PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    # Run for PRs created by the Jules bot or containing jules in the title/branch name
    if: |
      contains(github.event.pull_request.user.login, 'jules') || 
      contains(github.event.pull_request.head.ref, 'jules') ||
      contains(github.event.pull_request.title, 'Jules')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Approve the Pull Request
        run: gh pr review "${{ github.event.pull_request.html_url }}" --approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge the Pull Request
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --squash --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
